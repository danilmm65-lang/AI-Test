<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Extreme Pedagogy: Тест весов</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; background: #2a2a2a; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #00ffcc; margin-top: 0; }
        textarea { width: 100%; height: 100px; background: #3a3a3a; color: #fff; border: 1px solid #555; border-radius: 4px; padding: 10px; box-sizing: border-box; resize: none; }
        button { background: #00ffcc; color: #000; border: none; padding: 12px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        #status { font-style: italic; color: #aaa; margin-bottom: 20px; padding: 10px; background: #222; border-left: 4px solid #00ff00; }
        #result { margin-top: 25px; padding: 15px; background: #111; border-radius: 4px; min-height: 40px; word-wrap: break-word; color: #00ffcc; font-family: monospace; }
    </style>
</head>
<body>

<div class="container">
    <h2>Extreme Pedagogy: Симулятор весов</h2>
    
    <div id="status">✓ Система готова к работе (Локальный режим)</div>
    
    <label><p><strong>Ситуация:</strong> Ученик расстроен — его обижают одноклассники.</p></label>
    <label><p><strong>Ожидаемый стиль:</strong> Демократический (нужно выслушать, поддержать, обсудить вместе)</p></label>
    
    <textarea id="user-answer" placeholder="Например: Давай сядем вместе, обсудим ситуацию и решим, как поступить..."></textarea>
    <br><br>
    
    <button id="check-btn">ПРОГРАММИРОВАТЬ ВЕСЫ</button>
    
    <div id="result">Здесь появится вердикт системы...</div>
</div>

<script>
    const btn = document.getElementById("check-btn");
    const textarea = document.getElementById("user-answer");
    const resultDiv = document.getElementById("result");

    btn.onclick = function() {
        const text = textarea.value.toLowerCase();
        
        if (!text.trim()) {
            resultDiv.innerText = "Ошибка: Напишите сначала что-нибудь в поле ответа.";
            return;
        }

        resultDiv.innerText = "Идет анализ ответа алгоритмом весов...";

        setTimeout(() => {
            // Простейший триггер на демократические/гуманные ключевые педагогические слова
            const hasGoodWords = text.includes("обсуд") || text.includes("выслуш") || text.includes("вместе") || text.includes("поддерж") || text.includes("помогу") || text.includes("поговорим");
            
            // Если в тексте есть жесткие/авторитарные слова
            const hasBadWords = text.includes("накажу") || text.includes("выйди") || text.includes("замолчи") || text.includes("директор");

            if (hasGoodWords && !hasBadWords) {
                resultDiv.innerText = JSON.stringify({ "matched": true, "reason": "Ответ соответствует демократическому стилю. Предложено совместное решение проблемы." }, null, 2);
            } else {
                resultDiv.innerText = JSON.stringify({ "matched": false, "reason": "Ответ не соответствует стилю. Недостаточно поддержки или выбран слишком директивный тон." }, null, 2);
            }
        }, 800);
    };
</script>

</body>
</html>
